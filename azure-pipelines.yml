trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Names of the service connections created in Step 2
  dockerRegistryServiceConnection: 'DockerServiceConnection'
  azureSubscriptionConnection: 'AzureServiceConnectiom'
  
  # Docker Hub repository
  imageRepository: 'imagerepository'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Azure Web App Name (Replace with your actual app name)
  webAppName: 'webappname'

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    displayName: Build and Push
    steps:
    - task: Docker@2
      displayName: Build and push image to Docker Hub
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy Container
    steps:
    - task: AzureWebAppContainer@1
      displayName: Update Azure Web App Image
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        appName: $(webAppName)
        containers: $(imageRepository):$(tag)