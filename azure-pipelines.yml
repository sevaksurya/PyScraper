trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:

  - group: 'GitHub-Sync-Secrets'

  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  
  - name: tag
    value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    displayName: Build and Push
    steps:
    - task: Docker@2
      displayName: Build and push image to Docker Hub
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure App Service
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy Container
    steps:
    - task: AzureWebAppContainer@1
      displayName: Update Azure Web App Image
      inputs:
        azureSubscription: $(azureSubscriptionConnection)
        appName: $(webAppName)
        containers: $(imageRepository):$(tag)

- stage: Sync
  displayName: 'Sync to GitHub'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: SyncJob
    steps:
    - checkout: self
      persistCredentials: true
      fetchDepth: 0
    - bash: |
        git config --global user.email "pipeline@devops.local"
        git config --global user.name "DevOps Pipeline"
        
        git remote add github https://$MAPPED_PAT@github.com/$GitHubRepo
        git push github HEAD:refs/heads/$(Build.SourceBranchName) --force
      displayName: 'Push Mirror to GitHub'
      env:
        MAPPED_PAT: $(GITHUB_PAT)        